<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="一栋楼">
  <link rel="manifest" href="manifest.webmanifest?v=0.14.0">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192.png?v=0.14.0">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=0.14.0">
  <title>一栋楼</title>
</head>
<body>
  <div class="app">
    <header>
      <div><small>ONE BUILDING</small><h1>一栋楼</h1></div>
      <div class="header-actions"><button id="pauseGame" class="pause-button" type="button" aria-pressed="false">Ⅱ 暂停</button><div class="header-money"><span>大楼资金</span><b id="headerMoney">€0</b></div></div>
    </header>
    <section class="quick-stats">
      <div><span>楼层</span><b id="floorCount">1</b></div><div><span>居民</span><b id="populationCount">4</b></div><div><span>空床</span><b id="bedCount">2</b></div><div><span>版本</span><b id="shortVersion">读取中</b></div>
    </section>
    <section class="inventory-bar" aria-label="食物库存">
      <div><span>🥬 蔬菜</span><b id="vegetableCount">0</b></div>
      <div><span>🥩 肉</span><b id="meatCount">0</b></div>
      <div><span>🥛 牛奶</span><b id="milkCount">0</b></div>
      <div><span>时间</span><b id="gameClock">第1天 00:00</b></div>
    </section>
    <main>
      <section id="view-building" class="view active">
        <div class="view-title"><div><h2>大楼</h2><p>从第一层开始，一层层向上建造。</p></div><button id="goBuild" type="button">＋ 建造</button></div>
        <div id="towerShell" class="tower-shell disaster-snow"><div class="disaster-sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div id="disasterLabel" class="disaster-label">外部环境 · 永久暴雪</div><div id="tower" class="tower"></div><div class="ground">隔离地基</div></div>
      </section>
      <section id="view-build" class="view"><div class="view-title"><div><h2>建造房间</h2><p>新房间会自动建在大楼顶部。</p></div></div><div id="categoryTabs" class="category-tabs"></div><div id="roomCatalog" class="room-catalog"></div></section>
      <section id="view-tasks" class="view"><div class="view-title"><div><h2>运营状态</h2><p>查看居民状态和各类房间的供给能力。</p></div></div><div id="taskList" class="task-list"></div></section>
      <section id="view-status" class="view"><div class="view-title"><div><h2>游戏总览</h2><p>查看当前存档的整体情况。</p></div></div><div id="overview" class="overview"></div><div class="version-card">游戏更新到 <b id="currentVersion">读取中…</b> 版本</div><button id="resetGame" class="reset-button" type="button">重新开始游戏</button></section>
    </main>
    <nav>
      <button class="active" data-view="building" type="button"><b>▥</b><span>大楼</span></button><button data-view="build" type="button"><b>＋</b><span>建造</span></button><button data-view="tasks" type="button"><b>◎</b><span>运营</span></button><button data-view="status" type="button"><b>≡</b><span>总览</span></button>
    </nav>
  </div>
  <div id="backdrop" class="backdrop"></div>
  <section id="personSheet" class="person-sheet" aria-label="人物资料"><button id="closeSheet" class="sheet-close" type="button">×</button><div class="person-identity"><div id="sheetSprite" class="big-sprite"></div><div class="person-identity-copy"><small>居民档案</small><h2 id="sheetName"></h2><p id="sheetMeta"></p></div></div><div id="sheetNotice" class="person-notice" hidden></div><div id="sheetFamily" class="person-family"></div><div id="sheetSkills" class="sheet-skills"></div><div class="person-preferences"><div id="dietChoices" class="diet-choices"></div><div id="milkChoices" class="diet-choices"></div></div><div id="serviceChoices" class="diet-choices service-choices"></div></section>
  <section id="roomSheet" class="person-sheet room-sheet" aria-label="房间员工"><button id="closeRoomSheet" class="sheet-close" type="button">×</button><div class="room-sheet-icon">工</div><h2 id="roomSheetName"></h2><p id="roomSheetMeta"></p><div id="workerOptions" class="worker-options"></div></section>
  <div id="toast" class="toast"></div>
  <div id="celebration" class="celebration" aria-live="polite"><div id="celebrationConfetti" class="celebration-confetti"></div><strong id="celebrationTitle"></strong></div>
  <section id="deathNotice" class="death-notice" role="dialog" aria-modal="true" aria-labelledby="deathNoticeTitle" hidden><small>居民告示</small><h2 id="deathNoticeTitle">居民去世</h2><div id="deathNoticeSprite" class="big-sprite"></div><p id="deathNoticeSummary"></p><dl><div><dt>人物</dt><dd id="deathNoticeName"></dd></div><div><dt>情况</dt><dd id="deathNoticeSituation"></dd></div><div><dt>死因</dt><dd id="deathNoticeCause"></dd></div></dl><button id="confirmDeath" type="button">确定</button></section>
  <aside id="updateNotice" class="update-notice" hidden><span id="updateText">发现新版本</span><button id="updateButton" type="button">立即更新</button></aside>
  <script src="boot.js?v=0.15.2"></script>
</body>
</html>
