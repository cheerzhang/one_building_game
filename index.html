<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>一栋楼</title>
</head>
<body>
  <main class="app">
    <header>
      <span>生存建造 WAP 游戏</span>
      <h1>一栋楼</h1>
    </header>

    <section class="game-stage" aria-label="游戏区域">
      <p>新的大楼将在这里开始。</p>
      <div class="empty-building">
        <span>F1</span>
        <strong>第一层等待建造</strong>
      </div>
    </section>

    <footer>游戏更新到 <b id="currentVersion">读取中…</b> 版本</footer>
  </main>

  <aside id="updateNotice" class="update-notice" hidden>
    <span id="updateText">发现新版本</span>
    <button id="updateButton" type="button">立即更新</button>
  </aside>

  <script src="boot.js"></script>
</body>
</html>
